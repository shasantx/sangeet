name: Build Windows Desktop App (Rust)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop-rust/**'
      - '.github/workflows/windows-desktop.yml'

permissions:
  contents: write

jobs:
  build-windows-rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-rust

      - name: Build Dhun Windows Executable (Rust / Tauri v2)
        working-directory: desktop-rust
        run: cargo build --release

      - name: Package portable Dhun.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release" | Out-Null
          Copy-Item "desktop-rust\target\release\sangeet.exe" -Destination "release\Dhun.exe" -Force
          Get-Item "release\Dhun.exe" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: sangeet-windows-exe
          path: release/Dhun.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish Windows Desktop release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG="desktop-build-${{ github.run_number }}"
          TITLE="Dhun Windows Desktop (Rust) · build ${{ github.run_number }}"
          FILE="release/Dhun.exe"
          if gh release view "$CURRENT_TAG" >/dev/null 2>&1; then
            gh release upload "$CURRENT_TAG" "$FILE" --clobber
          else
            gh release create "$CURRENT_TAG" "$FILE" \
              --target "${{ github.sha }}" \
              --title "$TITLE" \
              --notes "Automated Windows Rust (Tauri v2) build for commit ${{ github.sha }}." \
              --latest=false
          fi

      - name: Keep only the latest Windows release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG="desktop-build-${{ github.run_number }}"
          for row in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            if [[ "$row" == desktop-build-* && "$row" != "$CURRENT_TAG" ]]; then
              gh release delete "$row" --yes --cleanup-tag || true
            fi
          done
