name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare public download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/sangeet-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sangeet-android-debug-apk
          path: android/app/build/outputs/apk/debug/sangeet-android.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish Android APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG="android-build-${{ github.run_number }}"
          TITLE="Sangeet Android · build ${{ github.run_number }}"
          FILE="android/app/build/outputs/apk/debug/sangeet-android.apk"
          if gh release view "$CURRENT_TAG" >/dev/null 2>&1; then
            gh release upload "$CURRENT_TAG" "$FILE" --clobber
          else
            gh release create "$CURRENT_TAG" "$FILE" \
              --target "${{ github.sha }}" \
              --title "$TITLE" \
              --notes "Automated Android APK build for commit ${{ github.sha }}." \
              --latest
          fi

      - name: Keep only the latest Android release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG="android-build-${{ github.run_number }}"
          for row in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            if [[ "$row" == android-build-* && "$row" != "$CURRENT_TAG" ]]; then
              gh release delete "$row" --yes --cleanup-tag || true
            fi
          done
