name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore release signing key
        env:
          DHUN_KEYSTORE_BASE64: ${{ secrets.DHUN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DHUN_KEYSTORE_BASE64" ]; then
            echo "::error::Missing DHUN_KEYSTORE_BASE64 secret. Release APKs must be signed with the permanent Dhun key."
            exit 1
          fi
          echo "$DHUN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dhun-release.jks"
          echo "DHUN_KEYSTORE_PATH=$RUNNER_TEMP/dhun-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        working-directory: android
        env:
          DHUN_KEYSTORE_PASSWORD: ${{ secrets.DHUN_KEYSTORE_PASSWORD }}
          DHUN_KEY_ALIAS: ${{ secrets.DHUN_KEY_ALIAS }}
          DHUN_KEY_PASSWORD: ${{ secrets.DHUN_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signature and prepare public download
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          cp "$APK" android/app/build/outputs/apk/release/sangeet-android.apk
          rm -f "$RUNNER_TEMP/dhun-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: sangeet-android-release-apk
          path: android/app/build/outputs/apk/release/sangeet-android.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish Android APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG="android-build-${{ github.run_number }}"
          TITLE="Dhun Android · build ${{ github.run_number }}"
          FILE="android/app/build/outputs/apk/release/sangeet-android.apk"
          if gh release view "$CURRENT_TAG" >/dev/null 2>&1; then
            gh release upload "$CURRENT_TAG" "$FILE" --clobber
          else
            gh release create "$CURRENT_TAG" "$FILE" \
              --target "${{ github.sha }}" \
              --title "$TITLE" \
              --notes "Automated Android APK build for commit ${{ github.sha }}." \
              --latest
          fi

      - name: Keep only the latest Android release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG="android-build-${{ github.run_number }}"
          for row in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            if [[ "$row" == android-build-* && "$row" != "$CURRENT_TAG" ]]; then
              gh release delete "$row" --yes --cleanup-tag || true
            fi
          done
