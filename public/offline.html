<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090c0a" />
  <title>Offline listening · Sangeet</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:#090c0a;color:#f5f7f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 78% 0%,#173322 0,transparent 42%),#090c0a}.wrap{width:min(100% - 32px,880px);margin:auto;padding:36px 0 48px}.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:700;letter-spacing:-.04em}.mark{display:block;width:38px;height:38px;object-fit:contain}.eyebrow{margin:56px 0 10px;color:#1ed760;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}h1{margin:0;font-size:clamp(36px,8vw,64px);line-height:.98;letter-spacing:-.065em}.sub{max-width:520px;margin:16px 0 28px;color:#a9b0aa;line-height:1.65}.panel{overflow:hidden;border:1px solid #ffffff19;border-radius:22px;background:#111612}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 19px;border-bottom:1px solid #ffffff12}.panel-head h2{margin:0;font-size:15px}.count{color:#929b94;font-size:12px}.list{padding:6px 12px}.item{display:grid;grid-template-columns:46px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid #ffffff0d}.item:last-child{border:0}.cover{width:46px;height:46px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(145deg,#1c6d49,#183222);color:#caffd9;font-size:11px;font-weight:700}.details{min-width:0}.title{overflow:hidden;color:#f2f6f2;font-size:13px;font-weight:650;text-overflow:ellipsis;white-space:nowrap}.artist{overflow:hidden;margin-top:4px;color:#8d9890;font-size:11px;text-overflow:ellipsis;white-space:nowrap}.play{min-height:36px;padding:0 14px;border:0;border-radius:999px;background:#1ed760;color:#07110a;font-weight:700;cursor:pointer}.empty{padding:30px 18px;text-align:center;color:#a9b0aa;font-size:13px;line-height:1.7}.player{position:sticky;bottom:12px;margin-top:14px;padding:12px;border:1px solid #ffffff1c;border-radius:16px;background:#151b16eF;backdrop-filter:blur(18px)}audio{display:block;width:100%;height:40px}.foot{display:flex;justify-content:space-between;gap:10px;margin-top:20px;color:#737e75;font-size:11px}.foot a{color:#aab5ac;text-decoration:none}@media(max-width:520px){.wrap{padding-top:22px}.eyebrow{margin-top:42px}.panel-head{padding:14px}.list{padding:4px 9px}.item{grid-template-columns:42px minmax(0,1fr) auto;gap:9px}.cover{width:42px;height:42px}.play{min-height:34px;padding:0 11px;font-size:11px}.foot{flex-direction:column}}
  </style>
</head>
<body>
  <main class="wrap">
    <a class="brand" href="/"><img class="mark" src="/sangeet-mark.svg" alt="" aria-hidden="true" /><span>Sangeet</span></a>
    <p class="eyebrow">Your saved music</p>
    <h1>Still here<br>when you’re offline.</h1>
    <p class="sub">Your downloaded tracks are ready. Choose a song and keep listening. Connect again to return to the full Sangeet experience.</p>
    <section class="panel" aria-labelledby="saved-title">
      <div class="panel-head"><h2 id="saved-title">Offline downloads</h2><span id="count" class="count">Loading…</span></div>
      <div id="list" class="list" aria-live="polite"></div>
    </section>
    <div class="player"><audio id="audio" controls preload="none" playsinline aria-label="Offline music player"></audio></div>
    <div class="foot"><span>Saved audio stays on this device.</span><a href="/">Back to Sangeet ↗</a></div>
  </main>
  <script>
    const list=document.getElementById('list'),audio=document.getElementById('audio'),count=document.getElementById('count');
    const safeText=(value,fallback)=>{try{return decodeURIComponent(value||'')||fallback}catch{return fallback}};
    const play=(url,title,artist,artwork)=>{audio.src=url;audio.play().catch(()=>{});if('mediaSession'in navigator&&'MediaMetadata'in window){navigator.mediaSession.metadata=new MediaMetadata({title,artist,artwork:artwork?[{src:artwork,sizes:'512x512'}]:[]});navigator.mediaSession.setActionHandler('play',()=>audio.play());navigator.mediaSession.setActionHandler('pause',()=>audio.pause());}};
    async function load(){try{const cache=await caches.open('sangeet-offline-audio-v1'),keys=await cache.keys();const requests=keys.filter(request=>new URL(request.url).pathname.startsWith('/audio/'));count.textContent=`${requests.length} ${requests.length===1?'track':'tracks'}`;if(!requests.length){list.innerHTML='<p class="empty">No tracks saved yet. Go online and use a track’s menu to save music for offline listening.</p>';return}for(const request of requests){const response=await cache.match(request),headers=response.headers,id=new URL(request.url).pathname.split('/').pop().replace(/\.mp3$/i,''),title=safeText(headers.get('x-sangeet-title'),id),artist=safeText(headers.get('x-sangeet-artist'),'Sangeet');const row=document.createElement('article');row.className='item';const cover=document.createElement('span');cover.className='cover';cover.textContent=title.split(/\s+/).slice(0,2).map(word=>word[0]||'').join('').toUpperCase();const details=document.createElement('span');details.className='details';const name=document.createElement('span');name.className='title';name.textContent=title;const by=document.createElement('span');by.className='artist';by.textContent=artist;details.append(name,by);const button=document.createElement('button');button.className='play';button.type='button';button.textContent='Play';button.setAttribute('aria-label',`Play ${title}`);button.addEventListener('click',()=>play(request.url,title,artist,''));row.append(cover,details,button);list.append(row)}}catch{count.textContent='Unavailable';list.innerHTML='<p class="empty">Offline storage is unavailable in this browser. Open Sangeet online to continue listening.</p>'}}
    load();
  </script>
</body>
</html>
