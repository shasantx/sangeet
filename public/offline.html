<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Dhun — Offline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #121212;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 28px;
      text-align: center;
    }
    .badge {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      border-radius: 9999px;
      background: #e2363e;
      color: #fff;
      font-weight: 900;
      font-size: 22px;
      display: grid;
      place-items: center;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 20px; font-size: 14px; color: #b3b3b3; line-height: 1.5; }
    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    a, button {
      border: 0;
      border-radius: 9999px;
      padding: 10px 20px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
    }
    .primary { background: #e2363e; color: #fff; }
    .secondary { background: #242424; color: #fff; }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">S</div>
    <h1>You&apos;re offline</h1>
    <p>Network streaming needs an internet connection, but your saved Offline &amp; Local Audio library still works.</p>
    <div class="actions">
      <a class="primary" href="/offline">Open Offline Library</a>
      <button class="secondary" type="button" onclick="location.reload()">Retry</button>
    </div>
  </main>
</body>
</html>
