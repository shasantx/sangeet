<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">

<defs>
  <linearGradient id="bg-blueroom" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1A1B" stop-opacity="1"/><stop offset="1" stop-color="#071010" stop-opacity="1"/></linearGradient>
  <filter id="grain-blueroom" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
    <feBlend in="SourceGraphic" mode="soft-light"/>
  </filter>
  <filter id="blur-blueroom" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="42"/></filter>
  <filter id="blur-wide-blueroom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
  <radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset="50%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".5"/></radialGradient>
</defs>
<rect width="1000" height="1000" fill="url(#bg-blueroom)"/>

      <rect width="1000" height="1000" fill="#0B1718"/>
      <rect x="240" y="140" width="520" height="500" fill="#4E7477" opacity=".24"/>
      <rect x="280" y="180" width="440" height="420" fill="none" stroke="#9EB9B6" opacity=".3"/>
      <path d="M240 140 L0 1000 H1000 L760 640Z" fill="#9DB7B3" opacity=".07"/>
      <circle cx="660" cy="350" r="48" fill="#C4D2C9" opacity=".44" filter="url(#blur-blueroom)"/>
      <rect x="500" y="680" width="390" height="4" fill="#7E9B97" opacity=".33"/>
      <rect x="500" y="710" width="260" height="2" fill="#7E9B97" opacity=".23"/>
      <text x="82" y="920" font-family="Arial, sans-serif" font-size="21" letter-spacing="8" fill="#DCE7E1" opacity=".67">AURA EDITORIAL</text>
      <text x="918" y="920" text-anchor="end" font-family="Arial, sans-serif" font-size="16" letter-spacing="3" fill="#DCE7E1" opacity=".35">THE BLUE ROOM</text>
      
<rect width="1000" height="1000" filter="url(#grain-blueroom)" opacity="1"/>
<rect width="1000" height="1000" fill="url(#vig)" opacity=".6"/>
</svg>