<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">

<defs>
  <linearGradient id="bg-sundayslow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D8B28D" stop-opacity="1"/><stop offset="1" stop-color="#9A7259" stop-opacity="1"/></linearGradient>
  <filter id="grain-sundayslow" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
    <feBlend in="SourceGraphic" mode="soft-light"/>
  </filter>
  <filter id="blur-sundayslow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="42"/></filter>
  <filter id="blur-wide-sundayslow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
  <radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset="50%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".5"/></radialGradient>
</defs>
<rect width="1000" height="1000" fill="url(#bg-sundayslow)"/>

      <rect width="1000" height="1000" fill="#C69A77"/>
      <rect y="0" width="1000" height="660" fill="#D7B08A"/>
      <circle cx="642" cy="286" r="144" fill="#EBD3B0" opacity=".88"/>
