<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">

<defs>
  <linearGradient id="bg-softfocus" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B6C2BF" stop-opacity="1"/><stop offset="1" stop-color="#859A97" stop-opacity="1"/></linearGradient>
  <filter id="grain-softfocus" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
    <feBlend in="SourceGraphic" mode="soft-light"/>
  </filter>
  <filter id="blur-softfocus" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="42"/></filter>
  <filter id="blur-wide-softfocus" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
  <radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset="50%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".5"/></radialGradient>
</defs>
<rect width="1000" height="1000" fill="url(#bg-softfocus)"/>

      <rect width="1000" height="1000" fill="#AEB9B8"/>
      <circle cx="310" cy="330" r="360" fill="#DCE3DE" opacity=".65" filter="url(#blur-wide-softfocus)"/>
      <circle cx="750" cy="680" r="350" fill="#718987" opacity=".45" filter="url(#blur-wide-softfocus)"/>
      <rect x="130" y="140" width="740" height="720" fill="none" stroke="#EEF1ED" opacity=".22"/>
      <g stroke="#E7ECE8" stroke-width="1.3" opacity=".5">
        <path d="M250 500 H750"/><path d="M300 530 H700"/><path d="M380 560 H620"/>
      </g>
      <text x="84" y="920" font-family="Arial, sans-serif" font-size="21" letter-spacing="8" fill="#FBFAF6" opacity=".75">AURA EDITORIAL</text>
      <text x="916" y="920" text-anchor="end" font-family="Arial, sans-serif" font-size="16" letter-spacing="3" fill="#FBFAF6" opacity=".44">SOFT FOCUS</text>
      

<rect width="1000" height="1000" fill="url(#vig)" opacity=".6"/>
</svg>