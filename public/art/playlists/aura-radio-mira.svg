<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">

<defs>
  <linearGradient id="bg-auramira" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#241019" stop-opacity="1"/><stop offset="1" stop-color="#10080C" stop-opacity="1"/></linearGradient>
  <filter id="grain-auramira" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
    <feBlend in="SourceGraphic" mode="soft-light"/>
  </filter>
  <filter id="blur-auramira" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="42"/></filter>
  <filter id="blur-wide-auramira" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
  <radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset="50%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".5"/></radialGradient>
</defs>
<rect width="1000" height="1000" fill="url(#bg-auramira)"/>

      <rect width="1000" height="1000" fill="#210F17"/>
      <circle cx="500" cy="470" r="310" fill="#8A435E" opacity=".38" filter="url(#blur-wide-auramira)"/>
      <path d="M355 680 C 320 570 335 430 410 380 H590 C 665 430 680 570 645 680Z" fill="#C3838D" opacity=".28" filter="url(#blur-auramira)"/>
      <circle cx="500" cy="365" r="96" fill="#D6A5A0" opacity=".28" filter="url(#blur-auramira)"/>
      <g fill="none" stroke="#E4C4B7" opacity=".27">
        <circle cx="500" cy="470" r="240"/><circle cx="500" cy="470" r="360"/>
      </g>
      <text x="500" y="810" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" letter-spacing="10" fill="#F3DDD4" opacity=".53">AURA RADIO</text>
      <text x="500" y="850" text-anchor="middle" font-family="Georgia, serif" font-size="31" font-style="italic" fill="#F3DDD4" opacity=".78">Mira Vale</text>
      
<rect width="1000" height="1000" filter="url(#grain-auramira)" opacity="1"/>
<rect width="1000" height="1000" fill="url(#vig)" opacity=".6"/>
</svg>