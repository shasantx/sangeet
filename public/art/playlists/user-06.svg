<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">

<defs>
  <linearGradient id="bg-usersix" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#150F19" stop-opacity="1"/><stop offset=".55" stop-color="#2A1B34" stop-opacity="1"/><stop offset="1" stop-color="#0A070C" stop-opacity="1"/></linearGradient>
  <filter id="grain-usersix" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch" result="noise"/>
