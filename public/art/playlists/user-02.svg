<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">

<defs>
  <linearGradient id="bg-usertwo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111A1C" stop-opacity="1"/><stop offset=".55" stop-color="#23383B" stop-opacity="1"/><stop offset="1" stop-color="#080C0D" stop-opacity="1"/></linearGradient>
  <filter id="grain-usertwo" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
    <feBlend in="SourceGraphic" mode="soft-light"/>
  </filter>
  <filter id="blur-usertwo" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="42"/></filter>
  <filter id="blur-wide-usertwo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
  <radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset="50%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".5"/></radialGradient>
</defs>
<rect width="1000" height="1000" fill="url(#bg-usertwo)"/>

      <rect width="1000" height="1000" fill="#10171A"/>
      <rect y="520" width="1000" height="480" fill="#0B1012"/>
      <circle cx="670" cy="330" r="270" fill="#6B8D91" opacity=".22" filter="url(#blur-wide-usertwo)"/>
