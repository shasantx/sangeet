<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">

<defs>
  <linearGradient id="bg-userone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C0B11" stop-opacity="1"/><stop offset=".55" stop-color="#1A1427" stop-opacity="1"/><stop offset="1" stop-color="#08070C" stop-opacity="1"/></linearGradient>
  <filter id="grain-userone" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
    <feBlend in="SourceGraphic" mode="soft-light"/>
  </filter>
  <filter id="blur-userone" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="42"/></filter>
  <filter id="blur-wide-userone" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
  <radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset="50%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".5"/></radialGradient>
</defs>
<rect width="1000" height="1000" fill="url(#bg-userone)"/>

      <rect width="1000" height="1000" fill="#0B0A10"/>
      <circle cx="320" cy="310" r="300" fill="#6A4A8C" opacity=".34" filter="url(#blur-wide-userone)"/>
      <circle cx="740" cy="690" r="350" fill="#2E3548" opacity=".48" filter="url(#blur-wide-userone)"/>
      <circle cx="500" cy="470" r="230" fill="none" stroke="#C9B7E8" opacity=".19"/>
      <circle cx="500" cy="470" r="164" fill="none" stroke="#C9B7E8" opacity=".12"/>
      <path d="M-30 690 C 220 590 330 780 520 660 S 790 570 1030 680" fill="none" stroke="#D7C8EA" stroke-width="1.3" opacity=".28"/>
      <g fill="#E7DCF2" opacity=".5"><circle cx="250" cy="240" r="2"/><circle cx="760" cy="330" r="1.5"/><circle cx="620" cy="760" r="1.8"/></g>
      <text x="500" y="848" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" letter-spacing="10" fill="#EDE6F3" opacity=".55">YOUR PLAYLIST</text>
      

<rect width="1000" height="1000" fill="url(#vig)" opacity=".6"/>
</svg>