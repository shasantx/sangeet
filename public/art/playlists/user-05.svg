<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">

<defs>
  <linearGradient id="bg-userfive" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17110C" stop-opacity="1"/><stop offset=".55" stop-color="#2E2419" stop-opacity="1"/><stop offset="1" stop-color="#0B0806" stop-opacity="1"/></linearGradient>
  <filter id="grain-userfive" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
    <feBlend in="SourceGraphic" mode="soft-light"/>
  </filter>
  <filter id="blur-userfive" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="42"/></filter>
  <filter id="blur-wide-userfive" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
  <radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset="50%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".5"/></radialGradient>
</defs>
<rect width="1000" height="1000" fill="url(#bg-userfive)"/>

      <rect width="1000" height="1000" fill="#15100C"/>
      <rect x="120" y="120" width="760" height="760" fill="none" stroke="#E0C59A" opacity=".12"/>
      <circle cx="360" cy="410" r="210" fill="#A57B4E" opacity=".2" filter="url(#blur-wide-userfive)"/>
      <circle cx="690" cy="620" r="180" fill="#5D6247" opacity=".22" filter="url(#blur-userfive)"/>
      <g fill="none" stroke="#EAD4AE" opacity=".2">
        <path d="M120 700 H880"/><path d="M120 646 H620"/><path d="M120 754 H440"/>
      </g>
      <text x="500" y="848" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" letter-spacing="10" fill="#F2E4CB" opacity=".55">YOUR PLAYLIST</text>
      

<rect width="1000" height="1000" fill="url(#vig)" opacity=".6"/>
</svg>