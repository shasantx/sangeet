<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">

<defs>
  <linearGradient id="bg-userfour" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C121C" stop-opacity="1"/><stop offset=".55" stop-color="#182B40" stop-opacity="1"/><stop offset="1" stop-color="#070A0E" stop-opacity="1"/></linearGradient>
  <filter id="grain-userfour" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
    <feBlend in="SourceGraphic" mode="soft-light"/>
  </filter>
  <filter id="blur-userfour" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="42"/></filter>
  <filter id="blur-wide-userfour" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
  <radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset="50%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".5"/></radialGradient>
</defs>
<rect width="1000" height="1000" fill="url(#bg-userfour)"/>

      <rect width="1000" height="1000" fill="#0B111A"/>
      <path d="M0 0 H1000 V1000 L0 0Z" fill="#23344A" opacity=".28"/>
      <circle cx="700" cy="300" r="280" fill="#556F96" opacity=".18" filter="url(#blur-wide-userfour)"/>
      <g stroke="#B8CAE1" opacity=".16">
        <path d="M170 820 L500 120"/><path d="M350 860 L620 150"/><path d="M540 900 L760 200"/>
      </g>
      <circle cx="500" cy="500" r="8" fill="#D3E0F0" opacity=".4"/>
      <text x="500" y="848" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" letter-spacing="10" fill="#D9E3F0" opacity=".55">YOUR PLAYLIST</text>
      
<rect width="1000" height="1000" filter="url(#grain-userfour)" opacity="1"/>
<rect width="1000" height="1000" fill="url(#vig)" opacity=".6"/>
</svg>