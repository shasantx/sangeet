<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">

<defs>
  <linearGradient id="bg-lowtide" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#283A3C" stop-opacity="1"/><stop offset="1" stop-color="#0B1213" stop-opacity="1"/></linearGradient>
  <filter id="grain-lowtide" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
    <feBlend in="SourceGraphic" mode="soft-light"/>
  </filter>
  <filter id="blur-lowtide" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="42"/></filter>
  <filter id="blur-wide-lowtide" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
  <radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset="50%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".5"/></radialGradient>
</defs>
<rect width="1000" height="1000" fill="url(#bg-lowtide)"/>

      <rect width="1000" height="1000" fill="#142022"/>
      <rect y="160" width="1000" height="620" fill="url(#bg-lowtide)" opacity=".9"/>
      <path d="M0 560 Q 210 540 400 558 T 760 548 T 1000 556 V1000 H0Z" fill="#0C1415"/>
      <path d="M0 664 Q 260 650 500 664 T 1000 660" fill="none" stroke="#D7D8C9" opacity=".27" stroke-width="1.3"/>
