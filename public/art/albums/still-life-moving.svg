<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">

<defs>
  <linearGradient id="bg-stilllife" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#211C13" stop-opacity="1"/><stop offset=".6" stop-color="#30261A" stop-opacity="1"/><stop offset="1" stop-color="#0E0D0A" stop-opacity="1"/></linearGradient>
  <filter id="grain-stilllife" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
    <feBlend in="SourceGraphic" mode="soft-light"/>
  </filter>
  <filter id="blur-stilllife" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="42"/></filter>
  <filter id="blur-wide-stilllife" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
  <radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset="50%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".5"/></radialGradient>
</defs>
<rect width="1000" height="1000" fill="url(#bg-stilllife)"/>

      <rect width="1000" height="1000" fill="#18150F"/>
      <path d="M0 760 H1000 V1000 H0Z" fill="#0E0D0A"/>
