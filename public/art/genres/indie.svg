<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">

<defs>
  <linearGradient id="bg-genreindie" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#151A14" stop-opacity="1"/><stop offset=".55" stop-color="#3A4027" stop-opacity="1"/><stop offset="1" stop-color="#151A14" stop-opacity="1"/></linearGradient>
  <filter id="grain-genreindie" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
    <feBlend in="SourceGraphic" mode="soft-light"/>
  </filter>
  <filter id="blur-genreindie" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="42"/></filter>
  <filter id="blur-wide-genreindie" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
  <radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset="50%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".5"/></radialGradient>
</defs>
<rect width="1000" height="1000" fill="url(#bg-genreindie)"/>

    <circle cx="500" cy="460" r="240" fill="#D3BF87" opacity=".13" filter="url(#blur-indie)"/>
    <path d="M0 640 Q 220 560 440 640 T 1000 620 V1000 H0Z" fill="#22281B" opacity=".8"/>
    <path d="M0 720 Q 250 680 520 730 T 1000 700 V1000 H0Z" fill="#11150F"/>
    <g stroke="#BFA76B" opacity=".2"><path d="M100 240 H900"/><path d="M100 290 H900"/></g>

<rect width="1000" height="1000" fill="url(#vig)" opacity=".6"/>
</svg>