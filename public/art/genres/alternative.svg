<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">

<defs>
  <linearGradient id="bg-genrealternative" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A0D0C" stop-opacity="1"/><stop offset=".55" stop-color="#5B2722" stop-opacity="1"/><stop offset="1" stop-color="#1A0D0C" stop-opacity="1"/></linearGradient>
  <filter id="grain-genrealternative" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
    <feBlend in="SourceGraphic" mode="soft-light"/>
  </filter>
  <filter id="blur-genrealternative" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="42"/></filter>
  <filter id="blur-wide-genrealternative" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
  <radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset="50%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".5"/></radialGradient>
</defs>
<rect width="1000" height="1000" fill="url(#bg-genrealternative)"/>

    <path d="M0 0 H1000 V1000 H0Z" fill="none"/>
    <path d="M110 720 C 260 420 380 180 620 280 S 890 620 780 880" fill="none" stroke="#E27766" stroke-width="150" opacity=".19" filter="url(#blur-alternative)"/>
    <path d="M210 760 C 330 520 410 320 590 380 S 770 610 690 840" fill="none" stroke="#F2C1B5" stroke-width="2" opacity=".3"/>
    <path d="M160 820 C 380 760 610 900 900 760" fill="none" stroke="#E27766" stroke-width="34" opacity=".12"/>
<rect width="1000" height="1000" filter="url(#grain-genrealternative)" opacity="1"/>
<rect width="1000" height="1000" fill="url(#vig)" opacity=".6"/>
</svg>