<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">

<defs>
  <linearGradient id="bg-genreambient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121420" stop-opacity="1"/><stop offset=".55" stop-color="#3E466B" stop-opacity="1"/><stop offset="1" stop-color="#121420" stop-opacity="1"/></linearGradient>
  <filter id="grain-genreambient" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
    <feBlend in="SourceGraphic" mode="soft-light"/>
  </filter>
  <filter id="blur-genreambient" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="42"/></filter>
  <filter id="blur-wide-genreambient" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
  <radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop offset="50%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".5"/></radialGradient>
</defs>
<rect width="1000" height="1000" fill="url(#bg-genreambient)"/>

    <circle cx="300" cy="390" r="280" fill="#8795C7" opacity=".22" filter="url(#blur-wide-ambient)"/>
    <circle cx="720" cy="620" r="320" fill="#4F5B86" opacity=".33" filter="url(#blur-wide-ambient)"/>
    <path d="M100 650 Q 300 580 500 650 T 900 630" fill="none" stroke="#C5CBE5" stroke-width="1.2" opacity=".34"/>
    <path d="M100 700 Q 300 630 500 700 T 900 680" fill="none" stroke="#C5CBE5" stroke-width="1.2" opacity=".2"/>

<rect width="1000" height="1000" fill="url(#vig)" opacity=".6"/>
</svg>