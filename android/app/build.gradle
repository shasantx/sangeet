plugins {
    id 'com.android.application'
}

android {
    namespace 'xyz.shasant.sangeet'
    compileSdk 35

    defaultConfig {
        applicationId 'xyz.shasant.sangeet'
        minSdk 24
        targetSdk 35
        versionCode 22
        versionName '2.4.0'
    }

    // Release builds are signed with ONE permanent key (kept in GitHub Secrets, never in git).
    // A stable signature is what lets Android install updates over the previous version,
    // and a non-debuggable, properly signed release APK is what Play Protect expects.
    def keystorePath = System.getenv('DHUN_KEYSTORE_PATH')
    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('DHUN_KEYSTORE_PASSWORD')
                keyAlias System.getenv('DHUN_KEY_ALIAS')
                keyPassword System.getenv('DHUN_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
