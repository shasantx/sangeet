<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube — Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 20'%3E%3Crect width='28' height='20' rx='5' fill='%23ff0033'/%3E%3Cpath d='M11 6l7 4-7 4z' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #ffffff;
    --bg-elev: #ffffff;
    --text: #0f0f0f;
    --text-2: #606060;
    --border: #e5e5e5;
    --chip: #f2f2f2;
    --chip-hover: #e5e5e5;
    --chip-active-bg: #0f0f0f;
    --chip-active-text: #ffffff;
    --hover: #f2f2f2;
    --search-bg: #f8f8f8;
    --header-bg: rgba(255, 255, 255, 0.97);
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
    --thumb: #e9e9e9;
    --brand: #ff0033;
    color-scheme: light;
  }
  html[data-theme="dark"] {
    --bg: #0f0f0f;
    --bg-elev: #212121;
    --text: #f1f1f1;
    --text-2: #aaaaaa;
    --border: #303030;
    --chip: #272727;
    --chip-hover: #3f3f3f;
    --chip-active-bg: #f1f1f1;
    --chip-active-text: #0f0f0f;
    --hover: #272727;
    --search-bg: #121212;
    --header-bg: rgba(15, 15, 15, 0.97);
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
    --thumb: #1f1f1f;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Roboto", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button { font-family: inherit; color: inherit; }
  button, a { -webkit-tap-highlight-color: transparent; }
  a { color: inherit; text-decoration: none; }
  svg { display: block; }
  ::selection { background: rgba(255, 0, 51, 0.25); }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 60;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 0 16px;
    background: var(--header-bg);
    backdrop-filter: blur(12px);
  }
  .topbar-left, .topbar-right, .topbar-center {
    display: flex;
    align-items: center;
  }
  .topbar-left { gap: 4px; flex: 0 0 auto; }
  .topbar-center {
    flex: 1 1 auto;
    justify-content: center;
    gap: 8px;
    min-width: 0;
    max-width: 720px;
  }
  .topbar-right { gap: 6px; flex: 0 0 auto; }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    color: var(--text);
    transition: background .15s ease;
    flex: none;
    position: relative;
  }
  .icon-btn:hover { background: var(--hover); }
  .icon-btn:focus-visible, .pill-btn:focus-visible, .avatar-btn:focus-visible,
  .chip:focus-visible, .nav-item:focus-visible, .search:focus-within {
    outline: 2px solid #3ea6ff;
    outline-offset: 1px;
  }
  .icon-btn svg { width: 24px; height: 24px; }

  .brand { display: flex; align-items: center; gap: 2px; padding: 0 8px 0 4px; }
  .brand-mark svg { width: 30px; height: 21px; }
  .brand-name {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.7px;
    margin-left: 3px;
  }
  .brand-country {
    font-size: 10px;
    color: var(--text-2);
    align-self: flex-start;
    margin: 12px 0 0 3px;
    letter-spacing: .2px;
  }

  .search {
    display: flex;
    flex: 1 1 auto;
    min-width: 0;
    height: 40px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--search-bg);
    overflow: hidden;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .search:focus-within {
    border-color: #3ea6ff;
    box-shadow: inset 0 0 0 1px #3ea6ff;
    background: var(--bg);
  }
  .search input {
    flex: 1 1 auto;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text);
    font-size: 16px;
    padding: 0 16px;
    font-family: inherit;
  }
  .search input::placeholder { color: var(--text-2); }
  .search-btn {
    flex: none;
    width: 64px;
    border: 0;
    border-left: 1px solid var(--border);
    background: var(--chip);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background .15s ease;
  }
  .search-btn:hover { background: var(--chip-hover); }
  .search-btn svg { width: 22px; height: 22px; }
  .mic { background: var(--chip); }
  .mic:hover { background: var(--chip-hover); }

  .pill-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 36px;
    padding: 0 14px 0 10px;
    border: 0;
    border-radius: 18px;
    background: var(--chip);
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s ease;
    white-space: nowrap;
  }
  .pill-btn:hover { background: var(--chip-hover); }
  .pill-btn svg { width: 22px; height: 22px; }

  .bell .badge {
    position: absolute;
    top: 4px;
    right: 3px;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    border-radius: 9px;
    background: #cc0000;
    color: #fff;
    font-size: 10px;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--bg);
  }
  .avatar-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 0;
    margin-left: 4px;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    flex: none;
    transition: transform .15s ease;
  }
  .avatar-btn:hover { transform: scale(1.06); }

  /* ---------- Layout ---------- */
  .layout { display: flex; align-items: flex-start; }

  .sidebar {
    position: sticky;
    top: 56px;
    width: 240px;
    flex: 0 0 240px;
    height: calc(100vh - 56px);
    overflow-y: auto;
    overflow-x: hidden;
    padding: 12px 12px 40px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    background: var(--bg);
    z-index: 50;
    transition: width .2s ease, flex-basis .2s ease, padding .2s ease;
  }
  .sidebar::-webkit-scrollbar { width: 8px; }
  .sidebar::-webkit-scrollbar-thumb { background: transparent; border-radius: 4px; }
  .sidebar:hover::-webkit-scrollbar-thumb { background: var(--border); }

  .nav-group { display: flex; flex-direction: column; gap: 2px; }
  .nav-group + .nav-group { margin-top: 8px; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 20px;
    height: 40px;
    padding: 0 12px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    cursor: pointer;
    font-size: 14px;
    color: var(--text);
    text-align: left;
    width: 100%;
    white-space: nowrap;
    transition: background .15s ease;
  }
  .nav-item:hover { background: var(--hover); }
  .nav-item.active { background: var(--hover); font-weight: 500; }
  .nav-item .ic { flex: none; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
  .nav-item .ic svg { width: 24px; height: 24px; }
  .nav-item .label { overflow: hidden; text-overflow: ellipsis; }
  .nav-item .tag {
    font-size: 10px;
    color: var(--text-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 4px;
    margin-left: 2px;
  }
  .nav-sep { height: 1px; background: var(--border); margin: 12px 0; flex: none; }
  .nav-title {
    font-size: 15px;
    font-weight: 500;
    padding: 8px 12px 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .nav-title svg { width: 14px; height: 14px; }

  .chan-avatar {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
  }
  .sidebar-footer {
    margin: 20px 12px 0;
    font-size: 12px;
    color: var(--text-2);
    line-height: 1.9;
  }
  .sidebar-footer .links { display: flex; flex-wrap: wrap; gap: 0 8px; font-weight: 500; color: var(--text-2); }
  .sidebar-footer .links span { cursor: pointer; }
  .sidebar-footer .links span:hover { color: var(--text); }
  .sidebar-footer .copy { margin-top: 12px; font-size: 11px; opacity: .8; }

  .backdrop {
    display: none;
    position: fixed;
    inset: 56px 0 0 0;
    background: rgba(0, 0, 0, .5);
    z-index: 45;
  }


  .content {
    flex: 1 1 auto;
    min-width: 0;
    padding: 0 24px 48px;
  }

  /* ---------- Chips ---------- */
  .chips-wrap {
    position: sticky;
    top: 56px;
    z-index: 40;
    background: var(--bg);
    padding: 12px 0;
    margin: 0 -4px;
  }
  .chips {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding: 0 4px 2px;
    scrollbar-width: none;
    scroll-behavior: smooth;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    height: 32px;
    padding: 0 12px;
    border: 0;
    border-radius: 8px;
    background: var(--chip);
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
    white-space: nowrap;
  }
  .chip:hover { background: var(--chip-hover); }
  .chip.active { background: var(--chip-active-bg); color: var(--chip-active-text); }

  /* ---------- Video grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 26px 16px;
    padding-top: 8px;
  }
  .card {
    display: flex;
    flex-direction: column;
    gap: 12px;
    cursor: pointer;
    animation: rise .35s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .thumb {
    position: relative;
    aspect-ratio: 16 / 9;
    border-radius: 12px;
    overflow: hidden;
    background: var(--thumb);
    isolation: isolate;
  }
  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .35s cubic-bezier(.2,.7,.3,1), filter .2s ease;
  }
  .card:hover .thumb img { transform: scale(1.035); filter: brightness(1.03); }
  .duration {
    position: absolute;
    right: 6px;
    bottom: 6px;
    background: rgba(0, 0, 0, .82);
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    padding: 2px 5px;
    border-radius: 4px;
    letter-spacing: .3px;
    z-index: 2;
  }
  .hover-actions {
    position: absolute;
    top: 6px;
    right: 6px;
    display: flex;
    gap: 2px;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity .18s ease, transform .18s ease;
    z-index: 2;
  }
  .card:hover .hover-actions { opacity: 1; transform: none; }
  .mini-btn {
    width: 28px;
    height: 28px;
    border: 0;
    border-radius: 6px;
    background: rgba(0, 0, 0, .78);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .mini-btn:hover { background: rgba(0, 0, 0, .95); }
  .mini-btn svg { width: 17px; height: 17px; }
  .live-badge {
    position: absolute;
    left: 6px;
    top: 6px;
    background: #cc0000;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    letter-spacing: .4px;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .live-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; }

  .progress {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 3px;
    background: rgba(255, 255, 255, .35);
    z-index: 2;
  }
  .progress span { display: block; height: 100%; background: #ff0033; }

  .meta { display: flex; gap: 12px; align-items: flex-start; padding-right: 6px; }
  .ch-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    text-transform: uppercase;
    margin-top: 1px;
  }
  .meta-text { min-width: 0; flex: 1 1 auto; }
  .v-title {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.4;
    margin: 0 0 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    letter-spacing: -.1px;
  }
  .v-channel, .v-stats {
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.4;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .v-channel { margin-bottom: 1px; }
  .v-channel:hover { color: var(--text); }
  .v-channel .verified { width: 13px; height: 13px; flex: none; color: var(--text-2); }
  .more-btn {
    border: 0;
    background: transparent;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text);
    opacity: 0;
    transition: opacity .15s, background .15s;
    margin-top: -2px;
    flex: none;
  }
  .card:hover .more-btn, .more-btn:focus-visible { opacity: 1; }
  .more-btn:hover { background: var(--hover); }
  .more-btn svg { width: 18px; height: 18px; }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    color: var(--text-2);
  }
  .empty svg { width: 56px; height: 56px; margin: 0 auto 16px; opacity: .4; }
  .empty h3 { margin: 0 0 6px; font-size: 18px; font-weight: 500; color: var(--text); }
  .empty p { margin: 0; font-size: 14px; }

  /* ---------- Watch overlay ---------- */
  .watch {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    padding: 24px;
    overflow-y: auto;
    background: rgba(0, 0, 0, .55);
    backdrop-filter: blur(4px);
  }
  .watch.open { display: block; animation: fade .18s ease both; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  .watch-card {
    max-width: 1100px;
    margin: 0 auto;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: var(--shadow);
    animation: pop .22s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes pop { from { transform: scale(.97) translateY(8px); opacity: 0 } to { transform: none; opacity: 1 } }
  .player {
    position: relative;
    aspect-ratio: 16 / 9;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .player img { width: 100%; height: 100%; object-fit: cover; opacity: .55; filter: blur(1px); }
  .play-big {
    position: absolute;
    width: 76px;
    height: 76px;
    border-radius: 50%;
    border: 0;
    background: rgba(255, 0, 51, .92);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform .15s ease, background .15s ease;
  }
  .play-big:hover { transform: scale(1.07); background: #ff0033; }
  .play-big svg { width: 34px; height: 34px; margin-left: 4px; }
  .player-bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 0 14px 10px;
    color: #fff;
    background: linear-gradient(transparent, rgba(0,0,0,.75));
  }
  .player-bar .track { height: 4px; border-radius: 2px; background: rgba(255,255,255,.3); margin: 10px 0 8px; }
  .player-bar .track span { display: block; width: 32%; height: 100%; background: #ff0033; border-radius: 2px; }
  .player-bar .row { display: flex; justify-content: space-between; font-size: 12px; opacity: .9; }

  .watch-body { padding: 18px 22px 24px; }
  .watch-body h2 { margin: 0 0 12px; font-size: 20px; line-height: 1.35; font-weight: 700; }
  .watch-sub { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .watch-chan { display: flex; align-items: center; gap: 12px; }
  .watch-chan .ch-avatar { width: 42px; height: 42px; font-size: 17px; }
  .watch-chan .name { font-weight: 500; font-size: 15px; }
  .watch-chan .subs { font-size: 12px; color: var(--text-2); }
  .subscribe {
    height: 36px;
    padding: 0 16px;
    border: 0;
    border-radius: 18px;
    background: var(--text);
    color: var(--bg);
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
    margin-left: 6px;
    transition: opacity .15s;
  }
  .subscribe:hover { opacity: .85; }
  .subscribe.on { background: var(--chip); color: var(--text); }
  .watch-actions { display: flex; gap: 8px; }
  .watch-actions button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 36px;
    padding: 0 14px;
    border: 0;
    border-radius: 18px;
    background: var(--chip);
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .watch-actions button:hover { background: var(--chip-hover); }
  .watch-actions button.liked { background: var(--text); color: var(--bg); }
  .watch-actions svg { width: 20px; height: 20px; }
  .watch-desc {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    background: var(--chip);
    font-size: 14px;
    line-height: 1.55;
    color: var(--text);
  }
  .watch-desc b { display: block; margin-bottom: 4px; }
  .watch-desc .dim { color: var(--text-2); }
  .close-watch {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 3;
    width: 36px;
    height: 36px;
    border: 0;
    border-radius: 50%;
    background: rgba(0, 0, 0, .6);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .close-watch:hover { background: rgba(0, 0, 0, .85); }
  .close-watch svg { width: 22px; height: 22px; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translate(-50%, 20px);
    background: #272727;
    color: #fff;
    font-size: 14px;
    padding: 12px 18px;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 200;
    max-width: calc(100vw - 40px);
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Responsive ---------- */
  @media (max-width: 999px) {
    .sidebar {
      position: fixed;
      left: 0;
      top: 56px;
      transform: translateX(-100%);
      transition: transform .22s cubic-bezier(.2,.7,.3,1);
      box-shadow: 8px 0 24px rgba(0, 0, 0, .12);
      height: calc(100vh - 56px);
      width: 240px;
      flex-basis: 240px;
      padding: 12px;
    }
    .sidebar.open { transform: none; }
    .backdrop.show { display: block; animation: fade .18s ease; }
    .content { padding: 0 16px 40px; }
  }
  @media (max-width: 840px) {
    .topbar-center { max-width: none; }
    .pill-btn .label, .brand-country { display: none; }
    .pill-btn { padding: 0; width: 40px; justify-content: center; background: transparent; }
    .pill-btn:hover { background: var(--hover); }
  }
  @media (max-width: 680px) {
    .topbar { padding: 0 8px; gap: 2px; }
    .topbar-center { gap: 4px; }
    .search-btn { width: 48px; }
    .mic { display: none; }
    .topbar-right { gap: 0; }
    .theme-btn { display: none; }
    .grid { grid-template-columns: 1fr; gap: 22px; }
    .content { padding: 0 8px 40px; }
    .chips-wrap { padding: 8px 0; }
    .card { animation: none; }
    .v-title { font-size: 14px; }
    .more-btn { opacity: 1; }
    .watch { padding: 0; }
    .watch-card { border-radius: 0; border: 0; min-height: 100%; }
    .watch-body { padding: 14px 16px 28px; }
    .watch-body h2 { font-size: 17px; }
  }
  @media (max-width: 480px) {
    .brand-name { display: none; }
    .topbar-left { gap: 0; }

    if (!query) return true;
    const q = query.toLowerCase();
    return v.title.toLowerCase().includes(q) || v.channel.toLowerCase().includes(q) || v.cat.toLowerCase().includes(q);
  }

  function cardHTML(v, index) {
    const initial = v.channel.replace(/[^A-Za-z0-9]/g, "").charAt(0) || "?";
    const thumbStyle = "background:linear-gradient(135deg," + v.color + "55," + v.color + "22)";
    return '' +
      '<article class="card" data-index="' + index + '" style="animation-delay:' + Math.min(index * 35, 350) + 'ms">' +
        '<div class="thumb" style="' + thumbStyle + '">' +
          '<img src="' + thumbUrl(v.seed) + '" alt="' + escapeAttr(v.title) + '" loading="lazy" onerror="this.remove()">' +
          (v.live ? '<span class="live-badge">LIVE</span>' : '<span class="duration">' + v.duration + '</span>') +
          '<div class="hover-actions">' +
            '<button class="mini-btn" data-act="later" title="Watch later" aria-label="Watch later">' + icons.clock + '</button>' +
            '<button class="mini-btn" data-act="save" title="Save to playlist" aria-label="Save to playlist">' + icons.save + '</button>' +
          '</div>' +
          (v.progress ? '<div class="progress"><span style="width:' + v.progress + '%"></span></div>' : '') +
        '</div>' +
        '<div class="meta">' +
          '<div class="ch-avatar" style="background:' + colorFor(v.channel) + '">' + initial + '</div>' +
          '<div class="meta-text">' +
            '<h3 class="v-title">' + escapeHTML(v.title) + '</h3>' +
            '<div class="v-channel">' + escapeHTML(v.channel) +
              (v.verified ? ' <span class="verified">' + icons.check + '</span>' : '') +
            '</div>' +
            '<div class="v-stats">' + escapeHTML(v.views) + (v.time ? ' &middot; ' + escapeHTML(v.time) : '') + '</div>' +
          '</div>' +
          '<button class="more-btn" aria-label="More actions" title="More">' + icons.dots + '</button>' +
        '</div>' +
      '</article>';
  }

  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }
  function escapeAttr(s) { return escapeHTML(s); }

  function render() {
    const list = videos.filter(matches);
    if (!list.length) {
      grid.innerHTML =
        '<div class="empty">' + icons.search +
        '<h3>No results found</h3><p>Try different keywords or remove search filters.</p></div>';
      return;
    }
    grid.innerHTML = list.map(function (v) { return cardHTML(v, videos.indexOf(v)); }).join("");
  }

  /* ---------------- Card interactions ---------------- */
  grid.addEventListener("click", function (e) {
    const actionBtn = e.target.closest("[data-act]");
    const moreBtn = e.target.closest(".more-btn");
    const card = e.target.closest(".card");

    if (!card) return;
    const index = Number(card.dataset.index);
    const video = videos[index];

    if (actionBtn) {
      e.stopPropagation();
      toast(actionBtn.dataset.act === "later" ? "Saved to Watch later" : "Saved to playlist");
      return;
    }
    if (moreBtn) {
      e.stopPropagation();
      toast("More options are not available in this demo");
      return;
    }
    openWatch(video);
    if (video) markWatched(video);
  });

  function markWatched(v) {
    v.progress = 12 + Math.floor(Math.random() * 40);
  }

  /* ---------------- Watch overlay ---------------- */
  const watch = document.getElementById("watch");
  const watchCard = document.getElementById("watchCard");
  let lastFocus = null;

  function openWatch(v) {
    lastFocus = document.activeElement;
    watchCard.innerHTML =
      '<div class="player">' +
        '<img src="' + thumbUrl(v.seed) + '" alt="" onerror="this.remove()">' +
        '<button class="close-watch" id="closeWatch" aria-label="Close player">' + icons.close + '</button>' +
        '<button class="play-big" id="playBig" aria-label="Play video">' + icons.play + '</button>' +
        '<div class="player-bar">' +
          '<div class="track"><span></span></div>' +
          '<div class="row"><span>3:42 / ' + v.duration + '</span><span>1080p &middot; Settings</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="watch-body">' +
        '<h2>' + escapeHTML(v.title) + '</h2>' +
        '<div class="watch-sub">' +
          '<div class="watch-chan">' +
            '<div class="ch-avatar" style="background:' + colorFor(v.channel) + '">' + (v.channel.replace(/[^A-Za-z0-9]/g, "").charAt(0) || "?") + '</div>' +
            '<div>' +
              '<div class="name">' + escapeHTML(v.channel) + '</div>' +
              '<div class="subs">' + (v.live ? "Live now" : "1.4M subscribers") + '</div>' +
            '</div>' +
            '<button class="subscribe" id="subBtn">Subscribe</button>' +
          '</div>' +
          '<div class="watch-actions">' +
            '<button id="likeBtn">' + icons.like + '<span>24K</span></button>' +
            '<button id="shareBtn">' + icons.share + '<span>Share</span></button>' +
          '</div>' +
        '</div>' +
        '<div class="watch-desc">' +
          '<b>' + escapeHTML(v.views) + (v.time ? " &middot; " + escapeHTML(v.time) : "") + '</b>' +
          escapeHTML(v.desc) +
          '<div class="dim" style="margin-top:8px">Category: ' + escapeHTML(v.cat) + '</div>' +
        '</div>' +
      '</div>';

    watch.classList.add("open");
    document.body.style.overflow = "hidden";

    document.getElementById("closeWatch").addEventListener("click", closeWatch);
    document.getElementById("playBig").addEventListener("click", function () { toast("Playing preview…"); });
    document.getElementById("subBtn").addEventListener("click", function () {
      this.classList.toggle("on");
      this.textContent = this.classList.contains("on") ? "Subscribed" : "Subscribe";
      toast(this.classList.contains("on") ? "Subscribed to " + v.channel : "Unsubscribed");
    });
    document.getElementById("likeBtn").addEventListener("click", function () {
      this.classList.toggle("liked");
      toast(this.classList.contains("liked") ? "Added to liked videos" : "Removed from liked videos");
    });
    document.getElementById("shareBtn").addEventListener("click", function () {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(location.href + "#" + v.seed).catch(function () {});
      }
      toast("Link copied to clipboard");
    });

    watch.scrollTop = 0;
  }

  function closeWatch() {
    watch.classList.remove("open");
    document.body.style.overflow = "";
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  watch.addEventListener("click", function (e) {
    if (e.target === watch) closeWatch();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && watch.classList.contains("open")) closeWatch();
    if (e.key === "/" && document.activeElement !== searchInput && !watch.classList.contains("open")) {
      e.preventDefault();
      searchInput.focus();
    }
  });

  /* ---------------- Search ---------------- */
  document.getElementById("searchForm").addEventListener("submit", function (e) {
    e.preventDefault();
    query = searchInput.value.trim();
    activeCat = "All";
    chipButtons.forEach(function (x) { x.classList.toggle("active", x.dataset.cat === "All"); });
    render();
    if (query) toast('Results for "' + query + '"');
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  let searchTimer;
  searchInput.addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      query = searchInput.value.trim();
      render();
    }, 160);
  });

  document.getElementById("micBtn").addEventListener("click", function () { toast("Voice search is not available in this demo"); });

  /* ---------------- Sidebar ---------------- */
  const sidebar = document.getElementById("sidebar");
  const backdrop = document.getElementById("backdrop");
  const menuBtn = document.getElementById("menuBtn");

  function isMobile() { return window.matchMedia("(max-width: 999px)").matches; }

  menuBtn.addEventListener("click", function () {
    if (isMobile()) {
      sidebar.classList.toggle("open");
      backdrop.classList.toggle("show", sidebar.classList.contains("open"));
    } else {
      sidebar.classList.toggle("collapsed");
      document.body.classList.toggle("sidebar-hidden");
      if (sidebar.classList.contains("collapsed")) {
        sidebar.style.display = "none";
        document.querySelector(".content").style.maxWidth = "1800px";
      } else {
        sidebar.style.display = "";
      }
    }
  });
  backdrop.addEventListener("click", function () {
    sidebar.classList.remove("open");
    backdrop.classList.remove("show");
  });

  document.querySelectorAll("#mainNav .nav-item").forEach(function (item) {
    item.addEventListener("click", function () {
      document.querySelectorAll("#mainNav .nav-item").forEach(function (x) { x.classList.remove("active"); });
      item.classList.add("active");
      activeCat = "All";
      query = "";
      searchInput.value = "";
      chipButtons.forEach(function (x) { x.classList.toggle("active", x.dataset.cat === "All"); });
      render();
      if (isMobile()) {
        sidebar.classList.remove("open");
        backdrop.classList.remove("show");
      }
      if (item.dataset.view !== "Home") {
        toast(item.dataset.view + " — coming soon in this demo");
      }
    });
  });

  document.querySelectorAll(".nav-item[data-view]:not(#mainNav .nav-item)").forEach(function (item) {
    item.addEventListener("click", function () {
      if (isMobile()) {
        sidebar.classList.remove("open");
        backdrop.classList.remove("show");
      }
      toast(item.dataset.view + " — coming soon in this demo");
    });
  });

  /* ---------------- Theme ---------------- */
  const themeBtn = document.getElementById("themeBtn");
  const root = document.documentElement;

  function applyTheme(theme) {
    root.setAttribute("data-theme", theme);
    themeBtn.innerHTML = theme === "dark"
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>';
    themeBtn.title = theme === "dark" ? "Switch to light theme" : "Switch to dark theme";
  }

  let stored = null;
  try { stored = localStorage.getItem("yt-theme"); } catch (err) {}
  const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(stored || (prefersDark ? "dark" : "light"));

  themeBtn.addEventListener("click", function () {
    const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem("yt-theme", next); } catch (err) {}
  });

  /* ---------------- Misc buttons ---------------- */
  document.getElementById("createBtn").addEventListener("click", function () { toast("Upload — this is a demo"); });
  document.getElementById("bellBtn").addEventListener("click", function () { toast("You have 9 new notifications"); });
  document.getElementById("avatarBtn").addEventListener("click", function () { toast("Signed in as Sam"); });

  /* ---------------- Toast ---------------- */
  let toastTimer;
  const toastEl = document.getElementById("toast");
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2200);
  }

  /* ---------------- Init ---------------- */
  render();
  applyTheme(root.getAttribute("data-theme") || "light");
})();
</script>
</body>
</html>
